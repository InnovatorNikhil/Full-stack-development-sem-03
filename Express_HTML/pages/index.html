<!DOCTYPE html>
<html>
<head>
    <title>My App</title>
</head>
<body>

    <h1 id="message">Loading...</h1>

    <script>
        fetch('/api/message')
            .then(response => response.json())
            .then(data => {
                document.getElementById('message').textContent = data.message;
            })
            .catch(error => {
                console.log(error);
            });
    </script>

</body>
</html>
