<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikhil Dubey | Coding Profiles</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
color:white;
}

.container{
max-width:700px;
width:100%;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
border-radius:20px;
padding:40px;
box-shadow:0 15px 40px rgba(0,0,0,.35);
text-align:center;
}

.profile{
width:120px;
height:120px;
border-radius:50%;
margin:auto;
background:#ffffff22;
display:flex;
justify-content:center;
align-items:center;
font-size:45px;
font-weight:bold;
margin-bottom:20px;
}

h1{
font-size:34px;
margin-bottom:8px;
}

.subtitle{
font-size:17px;
color:#cbd5e1;
margin-bottom:30px;
}

.card{
background:white;
color:#111827;
padding:18px;
margin:15px 0;
border-radius:14px;
display:flex;
justify-content:space-between;
align-items:center;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,.25);
}

.left{
display:flex;
align-items:center;
gap:15px;
font-size:18px;
font-weight:600;
}

.icon{
font-size:30px;
}

.btn{
text-decoration:none;
padding:10px 18px;
border-radius:8px;
font-weight:600;
color:white;
transition:.3s;
}

.leetcode{
background:#FFA116;
}

.codechef{
background:#8B4513;
}

.hackerrank{
background:#2EC866;
}

.github{
background:#24292e;
}

.btn:hover{
opacity:.9;
transform:scale(1.05);
}

footer{
margin-top:30px;
font-size:14px;
color:#cbd5e1;
}

@media(max-width:600px){

.card{
flex-direction:column;
gap:15px;
}

}
</style>

</head>
<body>

<div class="container">

<div class="profile">ND</div>

<h1>Nikhil Dubey</h1>

<p class="subtitle">
B.Tech CSE Student • Competitive Programmer • Java • DSA • Web Development
</p>

<div class="card">
<div class="left">
<span class="icon">🟡</span>
LeetCode
</div>

<a class="btn leetcode"
href="https://leetcode.com/u/nikhildubey05/"
target="_blank">
Visit
</a>

</div>

<div class="card">

<div class="left">
<span class="icon">🟤</span>
CodeChef
</div>

<a class="btn codechef"
href="https://www.codechef.com/users/nikhildubey05"
target="_blank">
Visit
</a>

</div>

<div class="card">

<div class="left">
<span class="icon">🟢</span>
HackerRank
</div>

<a class="btn hackerrank"
href="https://www.hackerrank.com/profile/nikhil_25b010111"
target="_blank">
Visit
</a>

</div>

<div class="card">

<div class="left">
<span class="icon">⚫</span>
GitHub
</div>

<a class="btn github"
href="https://github.com/InnovatorNikhil"
target="_blank">
Visit
</a>

</div>

<footer>

Made with ❤️ by Nikhil Dubey

</footer>

</div>

</body>
</html>
